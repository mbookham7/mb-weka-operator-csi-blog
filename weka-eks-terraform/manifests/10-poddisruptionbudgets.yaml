# ===========================================================================
#  DO NOT USE A PODDISRUPTIONBUDGET FOR THE WEKA CLIENT PODS
# ===========================================================================
# This file used to define two PodDisruptionBudgets. It defines none, because
# both were tested against a real cluster and both were WORSE THAN USELESS --
# they did not pace a node-group roll, they blocked every eviction forever.
#
# The file is kept, empty of objects, so that the finding is discoverable at
# the place where somebody would otherwise re-add them.
#
# ---------------------------------------------------------------------------
# WHAT WAS MEASURED
# ---------------------------------------------------------------------------
# Operator v1.16.0, WEKA 5.1.32.19, EKS 1.32, 3 client nodes. Both PDBs were
# applied and immediately reported:
#
#   kubectl -n weka-operator-system get pdb
#   NAME              MAX UNAVAILABLE   ALLOWED DISRUPTIONS
#   weka-client       1                 0
#   weka-node-agent   1                 0
#
#   weka-client:      DisruptionAllowed=False reason=SyncFailed
#                     "wekacontainers.weka.weka.io does not implement
#                      the scale subresource"
#   weka-node-agent:  DisruptionAllowed=False reason=SyncFailed
#                     "daemonsets.apps does not implement
#                      the scale subresource"
#
# `disruptionsAllowed: 0` is not a transient state here -- the disruption
# controller cannot compute an expected pod count, so it never rises. An
# actual eviction attempt:
#
#   Error from server (TooManyRequests): Cannot evict pod as it would
#   violate the pod's disruption budget.
#
# and after deleting the PDBs the same eviction returned 201 Success. So the
# PDB does not slow a drain down, it stops it: a managed node group update
# would hang until it timed out, on a cluster the PDB was added to protect.
#
# NOTE THIS IS NOT THE INTEGER-VS-PERCENTAGE ISSUE. An earlier version of
# this file claimed an integer `maxUnavailable` avoided the scale-subresource
# problem. It does not. Both budgets above used `maxUnavailable: 1`.
#
# ---------------------------------------------------------------------------
# WHAT TO DO INSTEAD -- AND IT IS ALREADY DONE
# ---------------------------------------------------------------------------
# The concern a PDB was meant to address is that a change to node-userdata.tf
# produces a new launch template version and EKS then rolls the whole node
# group. The right control for that is the node group's OWN update config,
# which needs no PDB and does not depend on any CRD implementing `scale`:
#
#   aws eks describe-nodegroup ... --query 'nodegroup.updateConfig'
#   { "maxUnavailablePercentage": 33 }
#
# Measured on this deployment. With 3 nodes that is one node at a time, which
# is exactly the pacing the PDB was supposed to provide. It was already in
# effect the whole time.
#
# To make it explicit, or to pin it at one node regardless of group size, set
# `update_config` on the node group in eks.tf:
#
#   update_config = { max_unavailable = 1 }
#
# And to stop an ordinary Terraform edit triggering a roll at all, see
# docs/node-preparation.md and `update_launch_template_default_version`.
#
# ---------------------------------------------------------------------------
# IF YOU STILL WANT A PDB
# ---------------------------------------------------------------------------
# It can only work for pods whose owning controller implements the scale
# subresource -- an ordinary Deployment or ReplicaSet. That covers your own
# workloads on the WEKA filesystem, which is where a PDB genuinely helps:
# they can be rescheduled onto another node and re-mount the same RWX volume.
# It does not cover the WEKA client containers themselves.
#
# 10-discover-pdb-selector.sh still works and will still find the right
# selector; the problem was never the selector.
